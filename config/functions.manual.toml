# name = "manual_00123450"
# start = 0x00123450
# end = 0x00123510
# mode = "recompile"
# handler = ""
# confidence = "high"
# evidence = "Call target and verified return boundary"
# reason = "Not emitted by automated analysis"

[[functions]]
name = "entry"
start = 0x00100008
end = 0x00100218
mode = "recompile"
handler = ""
override_analysis = true
confidence = "high"
evidence = "ELF entry disassembly and cold-boot trace: the local-link BGEZAL at 0x0010008C continues at 0x00100090; the bootstrap's final jump and delay slot are at 0x00100210-0x00100214, immediately before the next mapped function at 0x00100218."
reason = "Ghidra ended entry at the local-link instruction, leaving executable startup code without an owning function and causing a missing-target stop at 0x0010008C."

# Sony libpad2 is a transport-backed SDK library, not game logic. Bind the
# seven public calls used by this build to the reusable portable pad bridge.
# The exact ABI and stable-state facts are documented in the Phase 3 status
# record; these entries deliberately replace the analyzed guest DBC bodies.
[[functions]]
name = "hg_pad2_init"
start = 0x001EF990
end = 0x001EF9D0
mode = "runtime_bind"
handler = "scePad2Init"
override_analysis = true
confidence = "high"
evidence = "PS2Recomp SDK identification and exact ELF function bounds; libpad2 initialization resets socket state before the game's controller wrapper is constructed."
reason = "The guest SDK body depends on the unimplemented DBC/IOP pad transport; use the portable libpad2 host ABI instead."

[[functions]]
name = "hg_pad2_end"
start = 0x001EF9D0
end = 0x001EFA38
mode = "runtime_bind"
handler = "scePad2End"
override_analysis = true
confidence = "high"
evidence = "PS2Recomp SDK identification and exact ELF function bounds; the function tears down libpad2 sockets."
reason = "The guest SDK body depends on the unimplemented DBC/IOP pad transport; use the portable libpad2 host ABI instead."

[[functions]]
name = "hg_pad2_create_socket"
start = 0x001EFA38
end = 0x001EFB40
mode = "runtime_bind"
handler = "scePad2CreateSocket"
override_analysis = true
confidence = "high"
evidence = "PS2Recomp SDK identification, exact ELF bounds, and Haunting Ground caller 0x001BE6E4 passing a null descriptor plus its aligned DMA buffer."
reason = "The guest SDK body cannot create a DBC pad socket without an IOP pad service; bind the portable socket implementation."

[[functions]]
name = "hg_pad2_delete_socket"
start = 0x001EFB40
end = 0x001EFB94
mode = "runtime_bind"
handler = "scePad2DeleteSocket"
override_analysis = true
confidence = "high"
evidence = "PS2Recomp SDK identification and exact ELF function bounds; this is the inverse of scePad2CreateSocket."
reason = "The guest SDK body depends on the unimplemented DBC/IOP pad transport; use the portable socket teardown."

[[functions]]
name = "hg_pad2_read"
start = 0x001EFB98
end = 0x001EFC6C
mode = "runtime_bind"
handler = "scePad2Read"
override_analysis = true
confidence = "high"
evidence = "PS2Recomp SDK identification, reviewed full ELF body, and Haunting Ground caller 0x001BE548 passing socket and normalized read destination."
reason = "The guest SDK body reads a DBC-owned side buffer; bind it to the existing portable keyboard/gamepad sampler."

[[functions]]
name = "hg_pad2_get_button_profile"
start = 0x001EFC70
end = 0x001EFD3C
mode = "runtime_bind"
handler = "scePad2GetButtonProfile"
override_analysis = true
confidence = "high"
evidence = "PS2Recomp SDK identification, exact ELF bounds, and Haunting Ground caller 0x001BE530 passing its 0x13A-byte profile region."
reason = "The guest SDK profile is sourced from the unavailable IOP pad driver; expose the host pad capabilities through the portable bridge."

[[functions]]
name = "hg_pad2_get_state"
start = 0x001EFD40
end = 0x001EFE80
mode = "runtime_bind"
handler = "scePad2GetState"
override_analysis = true
confidence = "high"
evidence = "PS2Recomp SDK identification, exact ELF bounds, Haunting Ground polling at 0x001BE4D4, and the independently documented libpad2 stable value 1."
reason = "The guest SDK body reports disconnected because its DBC/IOP transport is absent; bind the portable socket state."

[[functions]]
name = "sdk_cosf"
start = 0x0031C058
end = 0x0031C140
mode = "runtime_bind"
handler = "cos"
confidence = "high"
evidence = "PS2Recomp SDK identification names cosf at 0x0031C058; the preceding atanf returns at 0x0031C050 with its delay slot at 0x0031C054, the next analyzed helper begins at 0x0031C140, and live draw-packet caller 0x00380F84 passes its argument in f12."
reason = "The standalone analysis omitted this SDK function start even though live game code calls it repeatedly; use the portable scalar math bridge selected by the base SDK map."

[[functions]]
name = "kCopy"
start = 0x00276348
end = 0x00276380
mode = "recompile"
handler = ""
confidence = "high"
evidence = "PS2Recomp SDK-symbol match plus local disassembly: aligned leaf function copies a2/4 words from a1 to a0 and returns at 0x00276378. PCSX2 oracle shows its address installed in syscall slot 0x5A."
reason = "Ghidra exported neither this function nor any owner for its range; the guest installs it as a kernel syscall override during startup."

[[functions]]
name = "kFindAddress"
start = 0x00276380
end = 0x002763C0
mode = "recompile"
handler = ""
confidence = "high"
evidence = "PS2Recomp SDK-symbol match plus local disassembly: aligned leaf function scans [a0,a1) for word a2 and returns its address or zero. PCSX2 oracle shows its address installed in syscall slot 0x83."
reason = "Ghidra exported neither this function nor any owner for its range; the missing syscall-override target caused the native boot to loop in InitSystemCallTableAddress."

[[functions]]
name = "EIntr"
start = 0x002762B0
end = 0x002762C8
mode = "recompile"
handler = ""
override_analysis = true
confidence = "high"
evidence = "Cold-boot branch trace stopped at 0x002762BC. Local disassembly shows the analyzed prefix reads COP0 Status and masks IE; the omitted aligned tail is EI at 0x002762BC, JR ra at 0x002762C0, and a return-value delay slot at 0x002762C4."
reason = "Ghidra ended the interrupt-enable leaf function before its EI and return sequence, leaving the fallthrough target without an owner."

[[functions]]
name = "InitTLBFunctions"
start = 0x00275B30
end = 0x00275BF4
mode = "recompile"
handler = ""
override_analysis = true
confidence = "high"
evidence = "PS2Recomp SDK-symbol match and cold-boot trace identify the function. Local disassembly shows uninterrupted control flow from the exported prefix through its register restores, JR ra at 0x00275BEC, and stack-restore delay slot at 0x00275BF0; the next wrapper begins at 0x00275BF8."
reason = "Ghidra ended the function after its first internal call at 0x00275B78, leaving the remaining TLB initialization body unmapped."

[[functions]]
name = "GetEntryAddress"
start = 0x00275B10
end = 0x00275B20
mode = "recompile"
handler = ""
confidence = "high"
evidence = "Cold-boot trace records a direct call from InitTLBFunctions at 0x00275BA8. Local disassembly is the complete aligned syscall wrapper: li v1,0x5B; syscall; JR ra; nop. PS2Recomp's SDK symbol database and runtime syscall dispatcher identify syscall 0x5B as GetEntryAddress."
reason = "Ghidra emitted no owner for this four-instruction library wrapper, so the direct call could not dispatch to statically recompiled code."

[[function_tables]]
name_prefix = "static_init"
table_start = 0x00469460
table_end = 0x0046969C
code_end = 0x00469460
override_analysis = true
confidence = "high"
evidence = "Cold boot reaches the generic indirect-call loop at 0x00100AE0-0x00100B40 with a0=0x00469460 and a1=0x0046969C. The ELF range contains 143 strictly increasing, aligned code addresses from 0x00464480 through 0x00469400, followed by a zero sentinel; the first unresolved JALR target is 0x00464480."
reason = "The analyzer omitted the complete late startup-initializer region because its functions are reached through a data pointer table rather than direct calls. Bounds are derived deterministically from successive reviewed table entries and the table start."

